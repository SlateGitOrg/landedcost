[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "landedcost"
version = "0.1.0"
description = "Landed-cost workbook with live Excel formulas: pipeline and safety stock for long lead times, plus closed-form break-even tariffs."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "landedcost contributors" }]
dependencies = [
  "numpy>=1.26",
  "openpyxl>=3.1",
  "formulas>=1.2",
  "typer>=0.12",
]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.5"]

[project.scripts]
landedcost = "landedcost.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["src/landedcost"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
filterwarnings = ["error"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = ["typer.Option", "typer.Argument"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["B011"]
